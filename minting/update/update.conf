# commec-in-a-box update configuration.  (installed to /etc/commec-box/update.conf)
# For devel testing, point conda_channels + probe_url at a dev channel (e.g. served from the
# mint host).

# Label recorded in release.json ("stable" or "devel"). Cosmetic.
channel=stable

# --- commec package -------------------------------------------------------------------------

# Conda channels searched for a newer commec (comma-separated, priority order).
conda_channels=conda-forge,bioconda

# Reachability probe (a HEAD-able URL). Decides "offline" vs "up-to-date" so the offline
# notice can be one-and-done instead of a false "you're up to date".
probe_url=https://conda.anaconda.org

# Background poll interval and startup delay, in seconds. The periodic poll is the fallback that
# catches a newly-published release while the box stays online; immediate refresh on a network
# change (e.g. connecting wifi post-boot) is handled by the NetworkManager dispatcher
# (commec-update-nm-dispatcher), so this can be modest without hurting responsiveness.
poll_interval=600
startup_delay=20

# --- screening databases --------------------------------------------------------------------

# DB directory baked at mint. commec-update-apply passes this to commec-patch-config after each
# A/B env build so the updated env gets the appliance's DB paths + blast_mt_mode=0; it is also
# where commec-db-apply installs database updates.
db_dir=/home/commec-user/commec-dbs

# Master switch for database updates. 0 disables the database half of the check and makes
# commec-db-apply refuse.
db_update_enabled=1

# Which set of revisions in the bucket's latest.json to track. "experimental" is not intended
# for deployed boxes.
db_channel=latest

# Override the database host. Empty = commec's own default (https://databases.commec.io), which
# is what the package itself uses; set it only to point at a mirror or a test bucket.
db_base_url=

# Free space kept in hand beyond the download plus its extracted size, in GiB. A database update
# is refused rather than risk filling the disk mid-extract.
db_free_margin_gb=5

# Unix account that owns the database tree; database downloads run as this user.
db_user=commec-user

# Local GUI status endpoint, used to refuse a database update while a screen is running.
gui_url=https://127.0.0.1/status
