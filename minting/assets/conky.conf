-- Commec box debug overlay: CPU, RAM, disk, and per-interface IPs (for debugging).
-- Font/bars scale with screen height so it is never tiny on any monitor.
-- Pinned top-right, undecorated, below windows, transparent over the wallpaper.
-- The Network section calls a helper script (complex shell can't live inline in
-- conky - brace/quote handling mangles it).
local function screen_h()
  local h
  local p = io.popen("xrandr --current 2>/dev/null")
  if p then local s = p:read("*a"); p:close(); h = tonumber(s:match("current%s+%d+%s+x%s+(%d+)")) end
  return h or 1080
end
local H    = screen_h()
local fs   = math.max(14, math.floor(H/65 + 0.5))   -- ~33pt @2160, ~17pt @1080
local bar  = math.max(8,  math.floor(fs * 0.7))
local gap  = math.floor(fs * 1.4)
local minw = fs * 26

conky.config = {
    alignment = 'top_right',
    gap_x = gap,
    gap_y = gap,
    minimum_width = minw,
    background = true,
    update_interval = 2,
    double_buffer = true,

    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    use_xft = true,
    font = 'DejaVu Sans Mono:size=' .. fs,
    default_color = 'white',
    draw_shades = true,
}

conky.text = [[
${color orange}COMMEC BOX${color}${alignr}${time %Y-%m-%d %H:%M:%S}
${hr 1}
${color orange}CPU${color} ${cpu}%${alignr}${freq_g} GHz
${cpubar ]] .. bar .. [[}
${color orange}RAM${color} ${mem} / ${memmax}${alignr}${memperc}%
${membar ]] .. bar .. [[}
${color orange}Disk /${color} ${fs_used /} / ${fs_size /}${alignr}${fs_used_perc /}%
${fs_bar ]] .. bar .. [[ /}
${color orange}Temps${color} ${execpi 5 /usr/local/bin/commec-conky-temp}
${hr 1}
${color orange}Network${color}
${execi 5 /usr/local/bin/commec-conky-net}
]]
